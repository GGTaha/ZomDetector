<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Identify Yourself!</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        /* Inline CSS for responsiveness */
        body {
            margin: 0;
            font-family: 'Arial', sans-serif;
            background-color: #1e1e1e;
            color: #fff;
            text-align: center;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            width: 90%;
            max-width: 800px;
            margin: 0 auto;
        }

        .home-button {
            position: absolute;
            top: 10px;
            left: 10px;
            background: #444;
            color: #fff;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
        }

        h1 {
            margin-bottom: 20px;
            font-size: 2.5vw;
        }

        .image-box {
            margin: 0 auto;
            border: 2px solid #00bfff;
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #333;
            position: relative;
            overflow: hidden;
            width: 50vw;
            height: 50vw;
            max-width: 400px;
            max-height: 400px;
        }

        #preview {
            max-width: 100%;
            max-height: 100%;
            display: block;
            position: absolute;
        }

        .select-image-label {
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
        }

        .select-button {
            background: #00bfff;
            border: none;
            padding: 1vw 2vw;
            margin-top: 10px;
            color: white;
            font-size: 1.2vw;
            border-radius: 5px;
            cursor: pointer;
        }

        .select-button:hover {
            background-color: #008cba;
        }

        #icon-placeholder {
            font-size: 3vw;
            color: #999;
        }

        input[type="file"] {
            display: none;
        }

        #result {
            margin-top: 20px;
            padding: 10px;
            background-color: #333;
            border-radius: 5px;
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <button class="home-button" onclick="window.location.href='/home'">Home Page</button>
        <h1>Identify Yourself!</h1>

        <!-- Image Upload Form -->
        <form id="upload-form" enctype="multipart/form-data">
            <div class="image-box" id="image-box">
                <img id="preview" src="#" alt="Image Preview" style="display: none;">
                <label for="file-input" class="select-image-label" id="label-container">
                    <span id="icon-placeholder">🖼️</span>
                    <button type="button" class="select-button">Select image</button> <!-- Prevent form submission -->
                </label>
                <input type="file" id="file-input" name="image" accept="image/*">
            </div>
            <button type="submit" class="select-button">Upload Image</button> <!-- Submit the form -->
        </form>

        <!-- Area to display result -->
        <div id="result"></div>
    </div>

    <script>
        document.querySelector('.select-button').addEventListener('click', function (event) {
            event.preventDefault(); // Prevent the button from submitting a form
            document.getElementById('file-input').click(); // Programmatically trigger the file input
        });

        document.getElementById('file-input').addEventListener('change', function (event) {
            const file = event.target.files[0];
            const preview = document.getElementById('preview');
            const placeholder = document.getElementById('icon-placeholder');
            const labelContainer = document.getElementById('label-container');
            const imageBox = document.getElementById('image-box');
            // Remove the button
            if (file) {
                const reader = new FileReader();
                reader.onload = function (e) {
                    preview.src = e.target.result;
                    preview.style.display = 'block';
                    placeholder.style.display = 'none';
                    labelContainer.style.display = 'none'; // Hide the button
                    // Resize the box
                    const img = new Image();
                    img.src = e.target.result;
                    img.onload = function () {
                        const aspectRatio = img.width / img.height;
                        const boxWidth = imageBox.offsetWidth;

                        if (aspectRatio > 1) {
                            imageBox.style.height = `${boxWidth / aspectRatio}px`;
                        } else {
                            imageBox.style.height = `${boxWidth}px`;
                        }
                    };
                };
                reader.readAsDataURL(file);
            }
        });

        // Handle form submission via AJAX
        document.getElementById('upload-form').addEventListener('submit', function (event) {
            event.preventDefault(); // Prevent default form submission
            
            const formData = new FormData(this);

            fetch('/upload', {
                method: 'POST',
                body: formData
            })
            .then(response => response.text())
            .then(result => {
                document.getElementById('result').style.display = 'block';
                document.getElementById('result').textContent = result;
            })
            .catch(error => {
                document.getElementById('result').style.display = 'block';
                document.getElementById('result').textContent = 'Error uploading the image.';
            });
        });
    </script>
</body>
</html>
